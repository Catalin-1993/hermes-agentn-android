name: Android APK (build only)

# Builds the full-edition debug APK and uploads it as a downloadable artifact.
# It runs the same steps as the "Android" workflow that produce the APK, but
# skips the test, lint, benchmark and Play-edition steps. Run it by hand from
# the Actions tab when you only need an APK to install on a phone. The full
# "Android" workflow remains the one that checks quality.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional. Also publish the APK as a GitHub release with this tag (for example v0.13.162), so the in-app updater can find it.
        required: false
        type: string

# Writing a release needs contents: write. Nothing runs on push or pull request.
permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ${{ fromJSON(vars.HERMES_ANDROID_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 ndk;27.3.13750724 cmake;3.31.6

      - name: Build the genuine Android Python SDK stack from source
        uses: ./.github/actions/prepare-android-python

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      # Android refuses to update an app over a build signed with a different key, and a runner
      # makes a new debug key every time. Store a debug keystore, base64-encoded, in the repository
      # secret DEBUG_KEYSTORE_BASE64 to keep the signature (and in-app updates) stable.
      - name: Use a fixed debug signing key (optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          fi

      - name: Build the full-edition debug APK
        working-directory: android
        env:
          SOURCE_DATE_EPOCH: "315532800"
          # The APK must report the tag it is published under, or the updater offers it again forever.
          HERMES_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          rm -rf ../build
          export PYTHON_FOR_BUILD="$(command -v python3.13 || command -v python3 || command -v python)"
          ./gradlew :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-agent-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish a GitHub release for the in-app updater
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          apk="$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)"
          mkdir -p dist
          cp "$apk" dist/agent-android-universal.apk
          (cd dist && sha256sum agent-android-universal.apk > agent-android-universal.apk.sha256)
          gh release create "$RELEASE_TAG" \
            dist/agent-android-universal.apk dist/agent-android-universal.apk.sha256 \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes "Debug-signed build of commit $GITHUB_SHA."
